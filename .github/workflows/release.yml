name: Release

# Push a tag like v0.2.5 (matching CFBundleShortVersionString) to build a
# universal Summonbar-<version>.zip signed with the Apple Development certificate
# and attach it to the release for that tag. A missing release is created as a
# draft for the notes. Apple Development builds can't be notarized.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app

      - name: Check the tag matches Info.plist
        run: |
          VERSION=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" Resources/Info.plist)
          if [[ "${GITHUB_REF_NAME}" != "v$VERSION" ]]; then
            echo "::error::Tag ${GITHUB_REF_NAME} doesn't match Info.plist version $VERSION"
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Import the signing certificate
        env:
          P12: ${{ secrets.SIGNING_P12 }}
          P12_PASSWORD: ${{ secrets.SIGNING_P12_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD=$(openssl rand -hex 16)
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$P12_PASSWORD" -T /usr/bin/codesign
          # The Apple Development certificate is only valid with its WWDR G3 intermediate.
          curl -fsSL -o "$RUNNER_TEMP/AppleWWDRCAG3.cer" https://www.apple.com/certificateauthority/AppleWWDRCAG3.cer
          security import "$RUNNER_TEMP/AppleWWDRCAG3.cer" -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/cert.p12"

      - name: Build and sign
        run: |
          SIGN_IDENTITY=$(security find-identity -v -p codesigning "$RUNNER_TEMP/signing.keychain-db" \
            | awk -F'"' 'index($2, "Apple Development") == 1 { print $2; exit }')
          if [[ -z "$SIGN_IDENTITY" ]]; then
            echo "::error::SIGNING_P12 has no valid Apple Development identity"
            exit 1
          fi
          SIGN_IDENTITY="$SIGN_IDENTITY" ./scripts/build-app.sh --release

      - name: Attach the zip to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ZIP="build/Summonbar-$VERSION.zip"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$ZIP" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$ZIP" --draft --title "Summonbar $VERSION" --generate-notes
          fi

      - name: Remove the signing keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true
