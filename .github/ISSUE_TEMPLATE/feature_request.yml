name: Feature request
description: Suggest an idea or a new agent integration
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do
      description: The task or annoyance behind the request.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you'd like Summonbar to do
      description: Key bindings, screens or config keys you have in mind.
  - type: checkboxes
    id: contribute
    attributes:
      label: Contributing
      options:
        - label: I'd like to work on this myself
