<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2B1C6B"/>
      <stop offset="0.55" stop-color="#151036"/>
      <stop offset="1" stop-color="#08071A"/>
    </linearGradient>
    <radialGradient id="halo" cx="512" cy="430" r="330" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#A78BFA" stop-opacity="0.55"/>
      <stop offset="0.5" stop-color="#7C3AED" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="beam" x1="0" y1="611" x2="0" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#C4B5FD" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#C4B5FD" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="star" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.45" stop-color="#E9D5FF"/>
      <stop offset="1" stop-color="#7DD3FC"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.08"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.12"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <clipPath id="body">
      <rect x="100" y="100" width="824" height="824" rx="186"/>
    </clipPath>
  </defs>

  <g filter="url(#shadow)">
    <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#bg)"/>
  </g>

  <g clip-path="url(#body)">
    <circle cx="512" cy="430" r="330" fill="url(#halo)"/>
    <!-- beam rising out of the bar -->
    <path d="M384 611 L474 360 L550 360 L640 611 Z" fill="url(#beam)"/>
  </g>

  <!-- launcher bar -->
  <rect x="222" y="610" width="580" height="124" rx="62" fill="url(#bar)" stroke="url(#rim)" stroke-width="5"/>
  <rect x="290" y="645" width="12" height="54" rx="6" fill="#FFFFFF"/>
  <rect x="330" y="664" width="190" height="16" rx="8" fill="#FFFFFF" fill-opacity="0.35"/>

  <!-- summoned sparkle -->
  <g transform="translate(512 405)">
    <path d="M0 -205 Q22 -22 205 0 Q22 22 0 205 Q-22 22 -205 0 Q-22 -22 0 -205 Z" fill="#C4B5FD" filter="url(#glow)" opacity="0.9"/>
    <path d="M0 -205 Q22 -22 205 0 Q22 22 0 205 Q-22 22 -205 0 Q-22 -22 0 -205 Z" fill="url(#star)"/>
  </g>
  <g transform="translate(712 262)">
    <path d="M0 -62 Q8 -8 62 0 Q8 8 0 62 Q-8 8 -62 0 Q-8 -8 0 -62 Z" fill="#E9D5FF"/>
  </g>
  <g transform="translate(318 300)">
    <path d="M0 -34 Q5 -5 34 0 Q5 5 0 34 Q-5 5 -34 0 Q-5 -5 0 -34 Z" fill="#7DD3FC" fill-opacity="0.9"/>
  </g>
</svg>
