<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1280" height="640" viewBox="0 0 1280 640">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1E1450"/>
      <stop offset="0.55" stop-color="#110C2E"/>
      <stop offset="1" stop-color="#07061A"/>
    </linearGradient>
    <radialGradient id="halo" cx="330" cy="320" r="360" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#A78BFA" stop-opacity="0.35"/>
      <stop offset="0.6" stop-color="#7C3AED" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.6" stop-color="#E9D5FF"/>
      <stop offset="1" stop-color="#7DD3FC"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.05"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="640" fill="url(#bg)"/>
  <circle cx="330" cy="320" r="360" fill="url(#halo)"/>

  <!-- scattered sparkles -->
  <g fill="#E9D5FF" opacity="0.5">
    <path transform="translate(1160 92)" d="M0 -16 Q2 -2 16 0 Q2 2 0 16 Q-2 2 -16 0 Q-2 -2 0 -16 Z"/>
    <path transform="translate(1086 560)" d="M0 -10 Q1.5 -1.5 10 0 Q1.5 1.5 0 10 Q-1.5 1.5 -10 0 Q-1.5 -1.5 0 -10 Z"/>
    <path transform="translate(120 548)" d="M0 -12 Q2 -2 12 0 Q2 2 0 12 Q-2 2 -12 0 Q-2 -2 0 -12 Z" fill="#7DD3FC"/>
  </g>

  <image href="logo.svg" xlink:href="logo.svg" x="110" y="120" width="400" height="400"/>

  <g font-family="-apple-system, 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif">
    <text x="560" y="250" font-size="92" font-weight="700" letter-spacing="-2" fill="url(#title)">Summonbar</text>
    <text x="562" y="308" font-size="32" font-weight="500" fill="#C4B5FD">A Raycast-style launcher for macOS</text>
    <text x="562" y="350" font-size="32" font-weight="500" fill="#C4B5FD">with coding agents built in.</text>

    <!-- launcher bar -->
    <rect x="560" y="398" width="600" height="76" rx="38" fill="url(#bar)" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="2"/>
    <rect x="596" y="420" width="6" height="32" rx="3" fill="#FFFFFF"/>
    <text x="620" y="446" font-size="25" fill="#FFFFFF" fill-opacity="0.85">Ask Claude Code: fix the failing test</text>
    <text x="1124" y="446" font-size="24" fill="#FFFFFF" fill-opacity="0.45" text-anchor="end">↵</text>

    <text x="562" y="528" font-size="22" font-weight="500" fill="#FFFFFF" fill-opacity="0.5">Claude Code · Codex · Gemini · opencode · Aider</text>
  </g>
</svg>
